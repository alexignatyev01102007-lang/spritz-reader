<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2D2D2D">
  <title>Spritz Reader</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <!-- Главный экран -->
  <div id="main-screen" class="screen active">
    <div class="container">
      <h1>Spritz Reader</h1>
      
      <button id="select-file" class="big-button">
         Выбрать файл
      </button>
      
      <input type="file" id="file-input" accept=".txt,.html,.htm,.epub,.fb2" style="display: none;">
      
      <div id="recent-files" class="recent-section">
        <h2>Недавние книги</h2>
        <div id="recent-list"></div>
      </div>
    </div>
  </div>

  <!-- Экран чтения -->
  <div id="reader-screen" class="screen">
    <div id="spritz-overlay">
      <div id="spritz-box">
        
        <!-- Кнопки экрана ВНУТРИ рамки, в углах -->
        <button class="corner-btn" id="orientation-btn" title="Блокировка поворота">🔓</button>
        <button class="corner-btn" id="fullscreen-btn" title="Полный экран">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
        
        <!-- Настройки в самом верху -->
        <div id="spritz-settings">
          <div class="setting-group">
            <button class="setting-btn" id="speed-dec">−</button>
            <span class="setting-label" id="speed-label">300</span>
            <button class="setting-btn" id="speed-inc">+</button>
          </div>
          
          <div class="setting-group">
            <button class="setting-btn" id="size-dec">A−</button>
            <span class="setting-label" id="size-label">52</span>
            <button class="setting-btn" id="size-inc">A+</button>
          </div>
          
          <div class="setting-group" id="font-selector">
            <button class="spritz-btn" id="font-btn">
              <span id="font-name">Системный моно</span>
              <span>▼</span>
            </button>
          </div>
        </div>
        
        <!-- Верхняя черта -->
        <div class="spritz-divider"></div>
        
        <!-- Слово -->
        <div id="spritz-word"></div>
        
        <!-- Нижняя черта -->
        <div class="spritz-divider"></div>
        
        <!-- Навигация -->
        <div id="spritz-navigation">
          <button class="nav-btn" id="nav-prev-sentence" title="Назад к началу предложения">«</button>
          <button class="nav-btn" id="nav-prev-word" title="Назад на слово">‹</button>
          
          <button class="spritz-btn" id="spritz-pause">Пауза</button>
          <button class="spritz-btn" id="spritz-stop">Стоп</button>
          
          <button class="nav-btn" id="nav-next-word" title="Вперёд на слово">›</button>
          <button class="nav-btn" id="nav-next-sentence" title="Вперёд к началу предложения">»</button>
          
          <button class="spritz-btn" id="spritz-restart" style="display: none;">Сначала</button>
        </div>
        
        <!-- Нижний ряд: библиотека слева, прогресс справа -->
        <div id="spritz-footer">
          <button class="back-btn" id="back-btn">← В библиотеку</button>
          <div id="spritz-progress">0 / 0</div>
        </div>
        
      </div>
    </div>
    
    <!-- Модальное окно выбора шрифта (поверх всего) -->
    <div id="font-modal" class="font-modal">
      <div class="font-modal-content">
        <div class="font-modal-header">
          <h3>Выберите шрифт</h3>
          <button class="font-modal-close" id="font-modal-close">✕</button>
        </div>
        <div id="font-modal-list"></div>
      </div>
    </div>
  </div>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <script src="parsers.js"></script>
  <script src="app.js"></script>
  <script src="reader.js"></script>
  
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js')
          .then(reg => console.log('SW registered:', reg))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
